<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Халяль · Узбекская кухня</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #1a0c0c;
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 20%),
                              radial-gradient(circle at 90% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 25%),
                              repeating-linear-gradient(45deg, rgba(255, 215, 0, 0.02) 0px, rgba(255, 215, 0, 0.02) 2px, transparent 2px, transparent 6px);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 12px;
        }
        
        .oriental-card {
            background: rgba(25, 15, 10, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.1) inset;
        }
        
        .gold-gradient {
            background: linear-gradient(135deg, #b8860b 0%, #ffd700 50%, #b8860b 100%);
        }
        
        .gold-text {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .category-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #e2e8f0;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }
        
        .category-chip.active {
            background: linear-gradient(135deg, #b8860b 0%, #ffd700 100%);
            border-color: #ffd700;
            color: #1a0c0c;
            font-weight: 600;
            box-shadow: 0 10px 20px -8px rgba(255, 215, 0, 0.4);
        }
        
        .item-card {
            background: rgba(45, 35, 30, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 24px;
            transition: all 0.3s ease;
        }
        
        .item-card:hover {
            border-color: rgba(255, 215, 0, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -12px rgba(255, 215, 0, 0.2);
        }
        
        .photo-gold-border {
            background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
            padding: 2px;
            border-radius: 20px;
        }
        
        .photo-inner {
            background: #2a1a15;
            border-radius: 18px;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .gold-button {
            background: linear-gradient(135deg, #b8860b 0%, #ffd700 50%, #b8860b 100%);
            transition: all 0.2s ease;
            color: #1a0c0c;
            font-weight: 600;
        }
        
        .gold-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px -6px #ffd700;
        }
        
        .sticky-footer {
            background: rgba(25, 15, 10, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 -10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        
        .order-badge {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 100px;
            padding: 4px 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }
        
        .categories-scroll {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .categories-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .ornament {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.03"><path d="M20,20 Q40,10 60,20 Q80,30 70,50 Q60,70 40,70 Q20,70 30,50 Q20,30 20,20" fill="none" stroke="%23ffd700" stroke-width="0.5"/><path d="M70,20 Q90,20 85,40 Q80,60 65,55 Q50,50 60,35 Q60,25 70,20" fill="none" stroke="%23ffd700" stroke-width="0.5"/></svg>');
            background-repeat: repeat;
            background-size: 80px 80px;
        }
    </style>
</head>
<body>
    <div class="ornament"></div>
    <div id="root" class="w-full max-w-[420px] mx-auto oriental-card overflow-hidden relative z-10"></div>

    <!-- React and ReactDOM -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <script>
        (function() {
            // ================================================================
            // ⚡ ДАННЫЕ ДЛЯ ХАЛЯЛЬ УЗБЕКСКОЙ КУХНИ
            // ================================================================
            const CONFIG = {
                managerUsername: "nesterenaa",      // Telegram менеджера
                brandName: "Халяль · Узбекская кухня",
                currency: "₽",
                categories: ["Выпечка", "Напитки", "Супы", "Гарниры", "Салаты", "Шашлыки", "Горячие блюда", "Соусы"],
                
                // Эмодзи для категорий
                categoryIcons: {
                    "Выпечка": "🥖",
                    "Напитки": "🧋",
                    "Супы": "🥣",
                    "Гарниры": "🍚",
                    "Салаты": "🥗",
                    "Шашлыки": "🥩",
                    "Горячие блюда": "🍲",
                    "Соусы": "🧂"
                },
                
                items: [
                    // САЛАТЫ
                    { id: 1, category: "Салаты", name: "Куриный", price: 250, desc: "160 г" },
                    { id: 2, category: "Салаты", name: "Овощной", price: 250, desc: "160 г" },
                    { id: 3, category: "Салаты", name: "Оливье", price: 250, desc: "160 г" },
                    { id: 4, category: "Салаты", name: "Шакароб", price: 250, desc: "160 г" },
                    { id: 5, category: "Салаты", name: "Грибной", price: 250, desc: "160 г" },
                    { id: 6, category: "Салаты", name: "Император", price: 250, desc: "160 г" },

                    // ГОРЯЧИЕ БЛЮДА
                    { id: 7, category: "Горячие блюда", name: "Бефстроганов", price: 600, desc: "350 г" },
                    { id: 8, category: "Горячие блюда", name: "Жареная курица с картошкой", price: 480, desc: "400 г" },
                    { id: 9, category: "Горячие блюда", name: "Казан-кебаб", price: 730, desc: "350 г" },
                    { id: 10, category: "Горячие блюда", name: "Манты", price: 480, desc: "400 г" },
                    { id: 11, category: "Горячие блюда", name: "Плов", price: 480, desc: "400 г" },

                    // СУПЫ
                    { id: 12, category: "Супы", name: "Борщ со сметаной", price: 480, desc: "400 г" },
                    { id: 13, category: "Супы", name: "Долма-шурпа", price: 480, desc: "400 г" },
                    { id: 14, category: "Супы", name: "Лагман", price: 480, desc: "400 г" },
                    { id: 15, category: "Супы", name: "Чучвара", price: 480, desc: "400 г" },
                    { id: 16, category: "Супы", name: "Шурпа", price: 480, desc: "400 г" },
                    { id: 17, category: "Супы", name: "Шурпа из баранины", price: 500, desc: "400 г" },

                    // ШАШЛЫКИ
                    { id: 18, category: "Шашлыки", name: "Люля-кебаб", price: 360, desc: "140 г" },
                    { id: 19, category: "Шашлыки", name: "Овощи на мангале", price: 350, desc: "200 г" },
                    { id: 20, category: "Шашлыки", name: "Шашлык из баранины", price: 470, desc: "180 г" },
                    { id: 21, category: "Шашлыки", name: "Шашлык из говядины", price: 440, desc: "180 г" },
                    { id: 22, category: "Шашлыки", name: "Шашлык из курицы", price: 400, desc: "180 г" },

                    // ВЫПЕЧКА
                    { id: 23, category: "Выпечка", name: "Лепешка", price: 120, desc: "300 г" },
                    { id: 24, category: "Выпечка", name: "Самса из баранины", price: 200, desc: "200 г" },
                    { id: 25, category: "Выпечка", name: "Самса из говядины", price: 180, desc: "200 г" },
                    { id: 26, category: "Выпечка", name: "Самса из курицы", price: 170, desc: "200 г" },
                    { id: 27, category: "Выпечка", name: "Самса из тандыра", price: 200, desc: "200 г" },

                    // ГАРНИРЫ
                    { id: 28, category: "Гарниры", name: "Картофель фри", price: 200, desc: "150 г" },
                    { id: 29, category: "Гарниры", name: "Макароны отварные", price: 200, desc: "130 г" },
                    { id: 30, category: "Гарниры", name: "Пюре картофельное", price: 200, desc: "150 г" },
                    { id: 31, category: "Гарниры", name: "Рис", price: 200, desc: "150 г" },

                    // НАПИТКИ
                    { id: 32, category: "Напитки", name: "Borjomi", price: 170, desc: "500 мл" },
                    { id: 33, category: "Напитки", name: "Вода без газа", price: 120, desc: "500 мл" },
                    { id: 34, category: "Напитки", name: "Добрый Кола (1л)", price: 200, desc: "1 л" },
                    { id: 35, category: "Напитки", name: "Кола добрый 0.5", price: 150, desc: "500 мл" },
                    { id: 36, category: "Напитки", name: "Натахтари", price: 180, desc: "500 мл" },

                    // СОУСЫ
                    { id: 37, category: "Соусы", name: "Майонез", price: 50, desc: "50 г" },
                    { id: 38, category: "Соусы", name: "Перец острый", price: 50, desc: "50 г" },
                    { id: 39, category: "Соусы", name: "Сметана", price: 60, desc: "50 г" },
                    { id: 40, category: "Соусы", name: "Томатный соус", price: 60, desc: "50 г" }
                ]
            };
            // ================================================================

            const STORAGE_KEY = 'uzbek_halal_cart';
            const formatPrice = (p) => `${p} ${CONFIG.currency}`;

            // 📌 Функция для генерации уникального номера заказа
            // Формат: ДДММ-ЧЧММ (например: 1203-1542 — 12 марта, 15:42)
            const generateOrderNumber = () => {
                const now = new Date();
                
                // День (2 цифры)
                const day = String(now.getDate()).padStart(2, '0');
                // Месяц (2 цифры)
                const month = String(now.getMonth() + 1).padStart(2, '0');
                // Часы (2 цифры)
                const hours = String(now.getHours()).padStart(2, '0');
                // Минуты (2 цифры)
                const minutes = String(now.getMinutes()).padStart(2, '0');
                
                return `${day}${month}-${hours}${minutes}`;
            };

            function App() {
                const [cart, setCart] = React.useState(() => {
                    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } 
                    catch { return {}; }
                });
                const [activeCategory, setActiveCategory] = React.useState(CONFIG.categories[0]);

                React.useEffect(() => {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
                }, [cart]);

                const totalPrice = Object.entries(cart).reduce((acc, [id, qty]) => {
                    const item = CONFIG.items.find(i => i.id === Number(id));
                    return acc + (item ? item.price * qty : 0);
                }, 0);
                
                const itemCount = Object.values(cart).reduce((acc, qty) => acc + qty, 0);

                const addToCart = (itemId) => setCart(prev => ({ ...prev, [itemId]: (prev[itemId] || 0) + 1 }));
                const removeFromCart = (itemId) => {
                    setCart(prev => {
                        const newCart = { ...prev };
                        if (newCart[itemId] > 1) newCart[itemId] -= 1;
                        else delete newCart[itemId];
                        return newCart;
                    });
                };

                const sendOrder = () => {
                    if (itemCount === 0) return;
                    
                    // 📌 Генерируем уникальный номер для этого заказа
                    const orderNumber = generateOrderNumber();
                    
                    let message = `🥘 *Заказ №${orderNumber}*\n`;
                    message += `📍 ${CONFIG.brandName}\n`;
                    message += `──────────────────\n`;
                    
                    CONFIG.items.forEach(item => {
                        if (cart[item.id]) {
                            message += `• ${item.name} x${cart[item.id]} — ${formatPrice(item.price * cart[item.id])}\n`;
                        }
                    });
                    
                    message += `──────────────────\n*💰 Итого: ${formatPrice(totalPrice)}*\n`;
                    message += `⏰ ${new Date().toLocaleTimeString()}`;
                    
                    window.location.href = `https://t.me/${CONFIG.managerUsername}?text=${encodeURIComponent(message)}`;
                };

                const filteredItems = CONFIG.items.filter(item => item.category === activeCategory);

                return React.createElement(
                    'div',
                    { className: 'p-5 pb-24 text-white' },

                    // Шапка
                    React.createElement(
                        'div',
                        { className: 'flex items-center gap-4 mb-4 animate__animated animate__fadeIn' },
                        React.createElement(
                            'div',
                            { className: 'w-14 h-14 rounded-2xl gold-gradient flex items-center justify-center text-2xl shadow-xl' },
                            '🥘'
                        ),
                        React.createElement(
                            'div',
                            { className: 'flex-1' },
                            React.createElement('h1', { className: 'text-2xl font-bold gold-text' }, CONFIG.brandName),
                            React.createElement('p', { className: 'text-amber-200/70 text-sm' }, '✔️ Халяль · ручная работа')
                        )
                    ),

                    // Категории
                    React.createElement(
                        'div',
                        { className: 'mb-6 overflow-x-auto categories-scroll whitespace-nowrap pb-2' },
                        CONFIG.categories.map(cat =>
                            React.createElement(
                                'button',
                                {
                                    key: cat,
                                    onClick: () => setActiveCategory(cat),
                                    className: `inline-flex items-center gap-1 mr-2 px-4 py-2.5 rounded-full text-sm font-medium category-chip transition-all ${
                                        activeCategory === cat ? 'active' : ''
                                    }`
                                },
                                React.createElement('span', null, CONFIG.categoryIcons[cat] || '•'),
                                cat
                            )
                        )
                    ),

                    // Список товаров
                    React.createElement(
                        'div',
                        { className: 'space-y-3' },
                        filteredItems.map(item => {
                            const qty = cart[item.id] || 0;
                            
                            return React.createElement(
                                'div',
                                {
                                    key: item.id,
                                    className: 'item-card p-4 flex gap-4 animate__animated animate__fadeInUp'
                                },
                                // Фото
                                React.createElement(
                                    'div',
                                    { className: 'photo-gold-border w-20 h-20 flex-shrink-0' },
                                    React.createElement(
                                        'div',
                                        { className: 'photo-inner text-3xl' },
                                        item.category === 'Шашлыки' ? '🥩' :
                                        item.category === 'Супы' ? '🥣' :
                                        item.category === 'Выпечка' ? '🥖' :
                                        item.category === 'Салаты' ? '🥗' :
                                        item.category === 'Горячие блюда' ? '🍲' :
                                        item.category === 'Гарниры' ? '🍚' :
                                        item.category === 'Напитки' ? '🧋' : '🍽️'
                                    )
                                ),
                                
                                // Инфо
                                React.createElement(
                                    'div',
                                    { className: 'flex-1' },
                                    React.createElement('h3', { className: 'font-semibold text-lg text-white' }, item.name),
                                    React.createElement('p', { className: 'text-xs text-amber-200/60 mb-2' }, item.desc),
                                    React.createElement(
                                        'div',
                                        { className: 'font-bold gold-text text-lg' },
                                        formatPrice(item.price)
                                    ),
                                    
                                    // Кнопки
                                    React.createElement(
                                        'div',
                                        { className: 'flex items-center gap-2 mt-2 justify-end' },
                                        qty > 0 &&
                                            React.createElement(
                                                'button',
                                                {
                                                    onClick: () => removeFromCart(item.id),
                                                    className: 'w-8 h-8 rounded-full bg-white/10 text-white font-bold hover:bg-white/20 transition-all'
                                                },
                                                '−'
                                            ),
                                        qty > 0 &&
                                            React.createElement(
                                                'span',
                                                { className: 'font-semibold gold-text min-w-[20px] text-center' },
                                                qty
                                            ),
                                        React.createElement(
                                            'button',
                                            {
                                                onClick: () => addToCart(item.id),
                                                className: 'w-8 h-8 rounded-full gold-button text-black font-bold hover:shadow-lg transition-all'
                                            },
                                            '+'
                                        )
                                    )
                                )
                            );
                        })
                    ),

                    // Футер с корзиной
                    itemCount > 0 &&
                    React.createElement(
                        'div',
                        {
                            className: 'fixed bottom-0 left-0 right-0 sticky-footer p-4',
                            style: { maxWidth: '420px', margin: '0 auto', borderRadius: '24px 24px 0 0' }
                        },
                        React.createElement(
                            'div',
                            { className: 'flex items-center justify-between' },
                            React.createElement(
                                'div',
                                null,
                                React.createElement('span', { className: 'text-amber-200/70 text-sm' }, 'Ваш заказ'),
                                React.createElement('div', { className: 'text-2xl font-bold gold-text' }, formatPrice(totalPrice)),
                                React.createElement('span', { className: 'text-xs text-amber-200/50' }, `${itemCount} позиций`)
                            ),
                            React.createElement(
                                'button',
                                {
                                    onClick: sendOrder,
                                    className: 'gold-button text-black px-6 py-3 rounded-xl font-semibold shadow-lg flex items-center gap-2 transition-all hover:shadow-xl active:scale-95'
                                },
                                '📲 Отправить заказ'
                            )
                        )
                    )
                );
            }

            const root = document.getElementById('root');
            ReactDOM.createRoot(root).render(React.createElement(App));
        })();
    </script>
</body>
</html>
